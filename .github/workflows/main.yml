# v1.1.3
name: Module CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'build/**'
      - 'README.md'
      - 'LICENSE'
    branches:
      [master, dev, features/render-templates]
  pull_request:
    branches:
      [master, dev, features/render-templates]
    paths-ignore:
      - 'docs/**'
      - 'build/**'
      - 'README.md'
      - 'LICENSE'
    
jobs:
  ci:
    runs-on: ubuntu-20.04
    env:
      SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
      NUGET_KEY: ${{ secrets.NUGET_KEY }}
      BLOB_SAS: ${{ secrets.BLOB_TOKEN }}
      VERSION_SUFFIX: ""

    steps:

      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          
      - name: Install VirtoCommerce.GlobalTool
        run: dotnet tool install --global VirtoCommerce.GlobalTool

      # - name: Install dotnet-sonarscanner
      #   run: dotnet tool install --global dotnet-sonarscanner

      - name: Get Image Version
        uses: VirtoCommerce/vc-github-actions/get-image-version@master
        id: image

      - name: Set VERSION_SUFFIX variable
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo "VERSION_SUFFIX=${{ steps.image.outputs.fullSuffix }}" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=${{ steps.image.outputs.suffix }}" >> $GITHUB_ENV
          fi;

      - name: Add version suffix
        if: ${{ github.ref != 'refs/heads/master' }}
        uses: VirtoCommerce/vc-github-actions/add-version-suffix@master
        with:
          versionSuffix: ${{ env.VERSION_SUFFIX }}

      # - name: SonarCloud Begin
      #   uses: VirtoCommerce/vc-github-actions/sonar-scanner-begin@master

      - name: Setup Git Credentials
      #  if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
        uses: VirtoCommerce/vc-github-actions/setup-git-credentials-github@master
        with: 
          githubToken: ${{ secrets.REPO_TOKEN }}

      - name: Clone page-builder
        if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
        run: |
            git clone https://github.com/VirtoCommerce/page-builder.git --branch main
            cd ./page-builder/src/page-builder
            npm i
            npm run build
            cd ../vanilla-preview
            npm i
            npm run build:prod
            cd ../../../
            mkdir ./src/VirtoCommerce.PageBuilderModule.Web/Content/
            mkdir ./src/VirtoCommerce.PageBuilderModule.Web/Content/builder/
            mkdir ./src/VirtoCommerce.PageBuilderModule.Web/Content/store/
            cp -R ./page-builder/src/page-builder/dist/page-builder/* ./src/VirtoCommerce.PageBuilderModule.Web/Content/builder/
            cp -R ./page-builder/src/vanilla-preview/dist/* ./src/VirtoCommerce.PageBuilderModule.Web/Content/store/
            mkdir ./src/VirtoCommerce.PageBuilderModule.Web/Content/builder/data/
            cp ./src/VirtoCommerce.PageBuilderModule.Web/settings.json ./src/VirtoCommerce.PageBuilderModule.Web/Content/builder/data/settings.json

      - name: Clone template-builder
        if: ${{ github.ref == 'refs/heads/features/render-templates' }}
        run: |
            git clone https://github.com/VirtoCommerce/template-builder.git --branch dev
            cd ./template-builder/src/builder
            npm i
            npm run build
            cd ../bridge
            npm i
            npm run build:prod
            cd ../../../
            mkdir ./src/VirtoCommerce.PageBuilderModule.Web/Content/
            mkdir ./src/VirtoCommerce.PageBuilderModule.Web/Content/builder/
            mkdir ./src/VirtoCommerce.PageBuilderModule.Web/Content/bridge/
            cp -R ./template-builder/src/builder/dist/template-builder/* ./src/VirtoCommerce.PageBuilderModule.Web/Content/builder/
            cp -R ./template-builder/src/bridge/dist/* ./src/VirtoCommerce.PageBuilderModule.Web/Content/bridge/
            
      # - name: Build
      #   run: vc-build Compile

    #  - name: Unit Tests
    #    run: vc-build Test -skip

      # - name: SonarCloud End
      #   uses: VirtoCommerce/vc-github-actions/sonar-scanner-end@master

      # - name: Quality Gate
      #   uses: VirtoCommerce/vc-github-actions/sonar-quality-gate@master
      #   with:
      #     login: ${{secrets.SONAR_TOKEN}}

      - name: Packaging
        run: vc-build Compress -skip Test
      
      # - name: Publish Nuget
      #   if: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') && github.event_name != 'workflow_dispatch' }}
      #   uses: VirtoCommerce/vc-github-actions/publish-nuget@master

      - name: Publish to Blob
        if: ${{ github.ref == 'refs/heads/features/render-templates' }}
        id: blobRelease
        uses: VirtoCommerce/vc-github-actions/publish-blob-release@master
        with:
          blobSAS: ${{ secrets.BLOB_TOKEN }}
        
      - name: Publish Github Release
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          changelog: ${{ steps.changelog.outputs.changelog }}
        uses: VirtoCommerce/vc-github-actions/publish-github-release@master
        
      # - name: Publish Manifest
      #   if: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') && github.event_name != 'workflow_dispatch' }}
      #   uses: VirtoCommerce/vc-github-actions/publish-manifest@master
      #   with:
      #     packageUrl: ${{ steps.blobRelease.outputs.packageUrl }}