<label [attr.title]="descriptor.hint" *ngIf="!hideLabel">{{descriptor.label}}</label>
<input *ngIf="!descriptor.multiline" #control type="text" class="form-control"
    [value]="value"
    (paste)="onPaste($event)" (keyup)="onChange($event.target.value)" />
<textarea *ngIf="descriptor.multiline" #textarea class="form-control"
    [value]="value"
    (paste)="onPaste($event)" (keyup)="onChange($event.target.value)"></textarea>
