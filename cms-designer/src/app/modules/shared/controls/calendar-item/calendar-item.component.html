<label *ngIf="!hideLabel">{{descriptor.label}}</label>
<div class="form-control-row">
    <input class="form-control" readonly="true" matInput [matDatepicker]="picker" [value]="value" (dateChange)="onDateChange($event)">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
</div>
<mat-datepicker #picker></mat-datepicker>
