name: pagebuilder_get_section_schema
description: |
  Load the full JSON schema for a single catalog entry by its path. Call AFTER `pagebuilder_list_section_schemas`, once per entry you actually plan to use plus the always-required composition entries (see below). Cache responses for the session — never re-fetch the same path.

  Response shape depends on `kind`:

  **For `sections` / `blocks` / `objects` / `shared`** — raw schema JSON exactly as stored on disk. The fields the agent acts on:
  ```json
  {
    "name": "<UI label>",
    "description": "<LLM-facing intent hint>",  // optional, theme-author convention. Recommended for sections / blocks / templates.
    "static": true | "top" | "bottom",          // sections only, optional. Truthy = section contributes fields to the page-level `settings`, not to `content[]`. NEVER use such a key as the `type` of an item in `content[]`.
    "includeShared": ["title", ...],            // optional: pulls in shared/<name> field lists
    "settings": [ <field schema>, ... ]         // the actual field list
  }
  ```
  Schemas may carry additional Designer-only metadata (`icon`, `displayField`, `tab`, `sort`, `group`, ...) — ignore any field not listed above.

  **For `templates`** — raw template JSON describing a page type:
  ```json
  {
    "version": <number>,                      // optional
    "settings": <SectionModel>,               // canonical fields of this page type's `settings` object
    "content":  [ <SectionModel>, ... ]       // default content skeleton
  }
  ```

  Templates are the source of truth for the canonical shape of a page's `settings` object for a given page type (page / catalog / product / cart / blog / ...). Static sections in the `sections` catalog can extend this with additional `settings` fields.

  Each item of `settings` is a field schema. The fields the agent acts on:
  ```json
  {
    "id": "<field name — used as the JSON key in the page output>",
    "description": "<LLM-facing intent hint>",  // optional, theme-author convention. Recommended on every meaningful field. For static sections (settings panels), prefer field-level descriptions over a root-level one.
    "type": "string | markdown | select | images | color | number | checkbox | list | object",
    "default": <any>,
    "required": true,
    "multiline": true,                                       // for string
    "multiple": false,                                       // for images
    "options": [{ "value": "<v>", "label": "<l>" }, ...],    // for select
    "element": [ <field schema>, ... ]                       // inner field list for list / object
  }
  ```
  Field schemas may carry additional Designer-only metadata (`label`, `title`, `tab`, `sort`, ...) — ignore any field not listed above.

  About `description` (both schema-root and per-field):
  - Theme-author convention, not enforced by backend. Targeted at the LLM (humans don't see it).
  - Suggested format: short prose with `Use when: ...` / `Skip when: ...` cues to disambiguate similar fields/schemas. One language per theme; no localization.
  - Use it to guide non-obvious choices: when to pick this section over a sibling, which `select.value` fits which intent, what content style the field expects, etc.

  Resolving the full authoritative field list for a section:
  1. Start with the section's own `settings` array.
  2. For every name in `includeShared`, append the `settings` array from the schema fetched via path `shared/<name>` (e.g. `shared/title`).
  3. Append the `settings` array from `shared/_sections` — the editor merges this into every section automatically (this is where `background` comes from).
  4. Use the same convention for blocks with `shared/_blocks`.

  Always also fetch, regardless of which sections you picked:
  - `shared/_sections` — global section settings (every section).
  - `shared/_blocks` — global block settings (only when you use blocks).
  - Every `shared/<name>` referenced by any chosen section's `includeShared`.

  Returns 404 when the path is not present in the catalog, or when a `_`-prefixed key is requested under `sections`/`blocks`/`objects` (those are theme-internal).
require_approval: false

parameters:
  type: object
  properties:
    storeId:
      type: string
      description: ID of the store whose theme schema should be loaded. Required.
    path:
      type: string
      description: |
        Catalog path of the schema entry, in the form "<kind>/<key>" — e.g. "sections/page-header", "templates/page", "blocks/feature", "shared/title", "shared/_sections".
        `kind` must be one of: sections, templates, blocks, objects, shared.
        `key` is the schema entry name (file name without `.json`).
        Underscore-prefixed keys are valid only under `shared`.
    theme:
      type: string
      description: Optional theme name. If omitted, the backend falls back to the store's default theme.
  required:
    - storeId
    - path

execution:
  endpoint: /api/pagebuilder/schemas/{{path}}
  method: GET
  mappings:
    request:
      query:
        storeId: "{{storeId}}"
        theme: "{{theme}}"
    response:
      schema: "_raw"

permission:
  - builder:read

tags:
  - pagebuilder
  - schema
  - read
