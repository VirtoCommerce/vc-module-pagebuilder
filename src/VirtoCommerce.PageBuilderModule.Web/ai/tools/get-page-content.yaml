name: pagebuilder_get_page_content
description: |
  Load the full JSON content of a PageBuilder page (page-level settings + ordered list of sections) for editing.
  Always loads the latest content (draft if present, otherwise published or archived).
  Returns the raw JSON document as a string under the "content" field — parse it before mutating, then save it back via pagebuilder_save_page_content.
require_approval: false

parameters:
  type: object
  properties:
    groupId:
      type: string
      description: ID of the grouped page (the value stored in "settings.id" inside the page JSON). Required.
  required:
    - groupId

execution:
  endpoint: /api/page-builder-pages/grouped/{groupId}/content
  method: GET
  mappings:
    request:
      query:
        draft: "true"
    response:
      content: "_raw"

permission:
  - builder:read

tags:
  - pagebuilder
  - page
  - read
