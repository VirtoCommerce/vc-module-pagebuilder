name: pagebuilder_list_section_schemas
description: |
  Return the lightweight catalog of schemas exposed by the current PageBuilder theme. Schemas are theme-specific and may evolve, so the agent must call this rather than rely on baked-in knowledge.

  Response shape:
  ```json
  {
    "sections":  [ <entry>, ... ],
    "templates": [ <entry>, ... ],
    "blocks":    [ <entry>, ... ],
    "objects":   [ <entry>, ... ],
    "shared":    [ <entry>, ... ]
  }
  ```

  Per-entry shape:
  ```json
  {
    "key": "<typeId>",
    "name": "<UI label>",
    "description": "<LLM-facing intent hint>"    // optional; only present for sections / templates / blocks
  }
  ```

  The catalog deliberately omits everything not needed for picking — Designer-only metadata (`displayField`, `icon`, `tab`, `sort`, `group`), field-resolution data (`includeShared`, `settings[]`), and the `static` marker. All of those are reflected (where relevant) in the full schema fetched via `pagebuilder_get_section_schema`.

  Catalog category semantics:
  - `sections` — content sections the user composes a page from. Entry `key` is the `type` value used in items of the page's `content[]` array. Theme-internal entries and page-level settings panels (schemas marked with truthy `static` on disk) are filtered out — the agent never sees them as separate entries; their fields are merged into the corresponding template's `settings[]` automatically (see `templates` below).
  - `templates` — page-type templates (e.g. `page`, `blogs`, `product`). The full template fetched via `pagebuilder_get_section_schema templates/<key>` carries the canonical `settings[]` field schema for that page type — already merged with all applicable static-section fields. This is the single source of truth for the page's `settings` shape.
  - `blocks` — block schemas referenced from inside section field lists; entry `key` is the `type` value used for nested blocks.
  - `objects` — reusable nested object schemas referenced by field schemas.
  - `shared` — global field lists merged into sections/blocks. Always includes `_sections` and `_blocks` (universal field lists every section/block inherits) plus theme-named lists (`title`, etc.) referenced via `includeShared`.

  Per-entry field semantics:
  - `key` — schema id. Use as the `<key>` half of `pagebuilder_get_section_schema` paths (`<kind>/<key>`).
  - `name` — short UI label. Useful as a fallback signal when picking; never copy into the output JSON.
  - `description` — optional theme-author hint aimed at the LLM (NOT shown to humans). Format convention: short prose with `Use when: ...` / `Skip when: ...` cues to disambiguate sibling schemas, plus inline per-field guidance (LLM should get all the context it needs from this single string). Backend exposes it only for `sections`, `templates`, `blocks` (the categories the agent picks by intent).

  Where the page's `settings` object schema comes from: the active **template** (`templates/<key>`). Its `settings[]` is the complete schema, including any page-level fields contributed by static sections — the backend pre-merges them into the template response.

  The backend filters theme-internal `_`/`__` entries from `sections`, `templates`, `blocks`, `objects`. Under `shared` the `_sections` and `_blocks` entries are intentionally exposed.

  The catalog does NOT include the field-level `settings[]` array — fetch the full schema with `pagebuilder_get_section_schema` for each entry you actually need.
require_approval: false

parameters:
  type: object
  properties:
    storeId:
      type: string
      description: ID of the store whose theme schemas should be loaded. Required.
    theme:
      type: string
      description: Optional theme name. If omitted, the backend falls back to the store's default theme.
  required:
    - storeId

execution:
  endpoint: /api/pagebuilder/schemas
  method: GET
  mappings:
    request:
      query:
        storeId: "{{storeId}}"
        theme: "{{theme}}"
    response:
      catalog: "$"

permission:
  - builder:read

tags:
  - pagebuilder
  - schema
  - read
