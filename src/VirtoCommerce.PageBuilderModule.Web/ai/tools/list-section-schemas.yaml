name: pagebuilder_list_section_schemas
description: |
  Return the lightweight catalog of schemas exposed by the current PageBuilder theme. Schemas are theme-specific and may evolve, so the agent must call this rather than rely on baked-in knowledge.

  Response shape:
  ```json
  {
    "sections":  [ <entry>, ... ],
    "templates": [ <entry>, ... ],
    "blocks":    [ <entry>, ... ],
    "objects":   [ <entry>, ... ],
    "shared":    [ <entry>, ... ]
  }
  ```

  Per-entry shape:
  ```json
  {
    "key": "<typeId>",
    "name": "<UI label>",
    "description": "<LLM-facing intent hint>",   // optional; only present for sections / templates / blocks
    "static": "top" | "bottom" | true,           // optional, sections only — see below
    "includeShared": ["title", ...]              // optional
  }
  ```

  The catalog deliberately omits Designer-only metadata (`displayField`, `icon`, `tab`, `sort`, `group`) — those are property-panel layout hints with no impact on the generated page.

  Catalog category semantics:
  - `sections` — schemas the user composes a page from. Two roles, distinguished by the `static` field on the entry:
    - **regular** (no `static` or falsy `static`) — content sections; entry `key` is the `type` value used in items of the page's `content[]` array.
    - **static** (truthy `static`: `true` / `"top"` / `"bottom"`) — these are NOT placed into `content[]`. They contribute extra fields to the page-level `settings` object (e.g. SEO meta, footer overrides, trackers). The editor renders them as fixed panels next to page settings (top region for `true`/`"top"`, bottom region for `"bottom"`). The agent MUST NOT use a static section's `key` as the `type` of an item in `content[]`.
  - `templates` — page-type templates (e.g. page, catalog, product, cart). Each template describes the canonical shape of a page's `settings` object plus a default `content[]` skeleton for that page type. The catalog entry is minimal (`key`, optional `version`); fetch the full template via `pagebuilder_get_section_schema` with `kind="templates"` to read its `settings` and `content`.
  - `blocks` — block schemas referenced from inside section field lists; entry `key` is the `type` value used for nested blocks.
  - `objects` — reusable nested object schemas referenced by field schemas.
  - `shared` — global field lists merged into sections/blocks. Always includes `_sections` and `_blocks` (universal field lists every section/block inherits) plus theme-named lists (`title`, etc.) referenced via `includeShared`.

  Per-entry field semantics:
  - `key` — schema id. Use as the `<key>` half of `pagebuilder_get_section_schema` paths (`<kind>/<key>`).
  - `name` — short UI label. Useful as a fallback signal when picking; never copy into the output JSON.
  - `description` — optional theme-author hint aimed at the LLM (NOT shown to humans). Format convention: short prose, ideally with `Use when: ...` / `Skip when: ...` cues to disambiguate sibling schemas. Backend exposes it only for `sections`, `templates`, `blocks` (the categories the agent picks by intent). For static sections (truthy `static`), root-level `description` is rarely useful — the LLM treats those as a flat extension of `settings` fields, so prefer field-level descriptions inside the schema (see `pagebuilder_get_section_schema`).
  - `static` — only meaningful on `sections`; absence/false means a regular content section, truthy values mark a settings-extension panel (see `sections` semantics above).
  - `includeShared` — names of `shared/<name>` field lists this entry pulls in; fetch each via `pagebuilder_get_section_schema` to resolve the full field list.

  Where the page's `settings` object schema comes from: the canonical fields are described by the active **template** (e.g. `templates/page.json`); additional fields can be contributed by **static sections** in the catalog. Together they define the full set of properties the page's `settings` object can carry.

  The backend filters theme-internal `_`/`__` entries from `sections`, `templates`, `blocks`, `objects`. Under `shared` the `_sections` and `_blocks` entries are intentionally exposed.

  The catalog does NOT include the field-level `settings[]` array — fetch the full schema with `pagebuilder_get_section_schema` for each entry you actually need.
require_approval: false

parameters:
  type: object
  properties:
    storeId:
      type: string
      description: ID of the store whose theme schemas should be loaded. Required.
    theme:
      type: string
      description: Optional theme name. If omitted, the backend falls back to the store's default theme.
  required:
    - storeId

execution:
  endpoint: /api/pagebuilder/schemas
  method: GET
  mappings:
    request:
      query:
        storeId: "{{storeId}}"
        theme: "{{theme}}"
    response:
      catalog: "$"

permission:
  - builder:read

tags:
  - pagebuilder
  - schema
  - read
