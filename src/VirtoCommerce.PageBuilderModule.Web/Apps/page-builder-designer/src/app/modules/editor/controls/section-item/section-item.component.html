<div class="section-item"
  [class.hidden]="section().hidden"
  (click)="onItemClick($event)"
  (mouseenter)="onItemHover()"
  (mouseleave)="onItemLeave()">
  <div class="w-6 h-6" (mouseenter)="isIconHover.set(true)" (mouseleave)="isIconHover.set(false)">
    @if (displayCheckbox()) {
      <app-checkbox
        class="section-item-checkbox"
        [controlValue]="selected()"
        (valueChanged)="onCheckboxValueChanged($event)"
        (click)="$event.stopPropagation()" />
    }
    @else {
      <app-icon>{{ sectionIcon() }}</app-icon>
    }
  </div>
  <div class="name" [title]="sectionName() + ' (' + section().id + ')'">{{ sectionName() }}</div>
  @if (isShared()) {
    <span class="shared-component-badge" [class.error]="sharedComponentError()"
      [title]="sharedComponentError() || ('Used on ' + (sharedComponent()?.usageCount || 0) + ' page(s)')">
      {{ sharedComponentError() ? 'Missing' : 'Shared' }}
      @if (!sharedComponentError()) {
        <span
          class="shared-component-usage"
          [attr.aria-label]="'Used on ' + (sharedComponent()?.usageCount || 0) + ' page(s)'">
          <span aria-hidden="true">·</span>
          {{ sharedComponent()?.usageCount || 0 }}
        </span>
      }
    </span>
  }
  @if (hasContextMenu()) {
    <app-context-menu
      [getActions]="getItemActions"
      [visible]="isHover()"
      (onAction)="onActionClick($event)" />
  }
</div>
