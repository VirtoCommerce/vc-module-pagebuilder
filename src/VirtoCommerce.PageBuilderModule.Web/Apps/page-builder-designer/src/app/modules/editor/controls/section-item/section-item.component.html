<div class="section-item"
  [class.hidden]="section().hidden"
  (contextmenu)="onContextMenu($event)"
  (mouseenter)="onItemHover()"
  (mouseleave)="onItemLeave()">
  @if (selectable()) {
    <app-checkbox
      class="section-item-checkbox"
      [accessibleLabel]="'Select ' + sectionName()"
      [controlValue]="selected()"
      (valueChanged)="onCheckboxValueChanged($event)" />
  }
  <button #editButton type="button" class="section-edit-button" [disabled]="!sectionSchema() && !isShared()"
    [title]="sectionTitle()" (click)="onItemClick($event)">
    <app-icon aria-hidden="true">{{ sectionIcon() }}</app-icon>
    <span class="name">{{ sectionName() }}</span>
    @if (isShared()) {
      <span class="shared-component-badge" [class.error]="sharedComponentError()"
        [title]="sharedComponentError() || ('Used on ' + (sharedComponent()?.usageCount || 0) + ' page(s)')">
        {{ sharedComponentError() ? 'Missing' : 'Shared' }}
        @if (!sharedComponentError()) {
          <span class="shared-component-usage">
            <span aria-hidden="true">· {{ sharedComponent()?.usageCount || 0 }}</span>
            <span class="sr-only">Used on {{ sharedComponent()?.usageCount || 0 }} page(s)</span>
          </span>
        }
      </span>
    }
  </button>
  @if (hasContextMenu()) {
    <app-context-menu
      [getActions]="getItemActions"
      [accessibleLabel]="'Actions for ' + sectionName()"
      [visible]="isHover()"
      (onAction)="onActionClick($event)" />
  }
</div>
