<div class="background"></div>
<div class="content" [style.width.px]="contentWidth()"
  [attr.role]="dismissible() ? 'region' : null" [attr.aria-label]="dismissible() ? accessibleLabel() : null"
  (keydown)="onKeydown($event)">
  <ng-content />
</div>
@if (expandable()) {
    <button type="button" [attr.aria-label]="isOpened() ? 'Reduce panel width' : 'Expand panel width'"
      class="expand"
      [style.left.px]="expanderPosition()"
      [ngClass]="{ expanded: isOpened() }"
      (click)="toggle()">
      <app-icon aria-hidden="true" [ngClass]="{ inverted: isOpened() }">chevron_right</app-icon>
    </button>
}
