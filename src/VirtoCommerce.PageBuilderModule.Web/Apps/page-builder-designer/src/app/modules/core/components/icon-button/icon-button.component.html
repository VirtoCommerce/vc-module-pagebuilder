<button
  [ngClass]="[skin() ? 'btn-skin-' + skin() : '', layout() ? 'btn-layout-' + layout() : '']"
  type="button"
  [disabled]="disabled()"
  (click)="raiseOnClick($event)">
  @if (icon()) {
    <app-icon [ngClass]="{ disabled: disabled() }">{{ icon() }}</app-icon>
  }
  <span class="text">{{ text() }}</span>
</button>
