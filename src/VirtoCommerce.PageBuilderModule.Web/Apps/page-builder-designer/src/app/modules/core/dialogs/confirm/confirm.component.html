<mat-dialog-content>
  <div class="flex items-start gap-4">
    @if (icon) {
      <app-icon class="shrink-0" style="color: #D72C0D;">{{ icon }}</app-icon>
    }
    <span>{{ title }}</span>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <div class="flex gap-2">
    <app-icon-button (click)="confirm()" skin="primary" [text]="confirmText" />
    <app-icon-button (click)="decline()" skin="outline" [text]="declineText" />
  </div>
</mat-dialog-actions>
