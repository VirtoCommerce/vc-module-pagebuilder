<div class="flex flex-row items-start">
  @if (icon) {
    <app-icon style="color: #D72C0D;">{{ icon }}</app-icon>
  }
  <div class="ml-4">
    <div mat-dialog-content> {{ title }} </div>
    <div mat-dialog-actions>
      <div class="flex flex-row space-x-2">
        <app-icon-button (click)="confirm()" skin="primary" [text]="confirmText" />
        <app-icon-button (click)="decline()" skin="outline" [text]="declineText" />
      </div>
    </div>
  </div>
</div>
