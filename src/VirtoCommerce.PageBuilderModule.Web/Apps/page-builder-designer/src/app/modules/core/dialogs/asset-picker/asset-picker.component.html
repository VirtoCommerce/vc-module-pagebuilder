<div class="asset-picker" [ngClass]="{ 'asset-picker--dragging': state.dragging() }">
  <div class="header">
    <div>
      <h2>{{ state.title }}</h2>
      <app-asset-picker-breadcrumbs
        [breadcrumbs]="state.breadcrumbs()"
        (navigate)="state.navigateToBreadcrumb($event)" />
    </div>
    <button type="button" class="close" title="Close" (click)="decline()">
      <app-icon>close</app-icon>
    </button>
  </div>

  <div
    mat-dialog-content
    class="content"
    (dragenter)="state.onDragEnter($event)"
    (dragover)="state.onDragOver($event)"
    (dragleave)="state.onDragLeave($event)"
    (drop)="state.onDrop($event)">
    <app-asset-picker-toolbar
      [labels]="state.labels"
      [uploading]="state.uploading()"
      [loading]="state.loading()"
      [multiple]="state.multiple"
      [acceptAttribute]="state.acceptAttribute()"
      [searchValue]="state.searchValue()"
      [counterText]="state.formatAssetsCounter(state.visibleAssetsCount())"
      (searchChanged)="state.onSearch($event)"
      (upload)="state.uploadFiles($event)" />

    @if (state.error()) {
      <div class="message message--error">{{ state.error() }}</div>
    } @else if (state.loading()) {
      <div class="message">{{ state.labels.loading }}</div>
    } @else if (!state.visibleEntries().length) {
      <div class="message">{{ state.labels.empty }}</div>
    } @else {
      <app-asset-picker-grid
        [entries]="state.visibleEntries()"
        [multiple]="state.multiple"
        (entryClick)="state.navigateTo($event); state.selectAsset($event)"
        (assetDoubleClick)="confirm()"
        (folderDragOver)="state.onFolderDragOver($event.event, $event.entry)"
        (folderDragLeave)="state.onFolderDragLeave($event.event, $event.entry)"
        (folderDrop)="state.onFolderDrop($event.event, $event.entry)" />
    }
  </div>

  <div mat-dialog-actions>
    <app-icon-button skin="outline" [text]="state.labels.cancel" (click)="decline()" />
    <app-icon-button skin="primary" [text]="state.selectButtonText()" [disabled]="!state.selectedCount()" (click)="confirm()" />
  </div>
</div>
