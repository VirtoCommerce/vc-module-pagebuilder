<div class="wrapper" [ngStyle]="{ opacity: isOpen || visible() || customTrigger() ? '1' : '0' }">

  <div cdkOverlayOrigin #trigger="cdkOverlayOrigin" (keypress)="gearClick($event)" (click)="gearClick($event)">
    @if (customTrigger()) {
    <ng-content />
    } @else {
    <app-icon class="icon" [class.opened]="isOpen">tune</app-icon>
    }
  </div>
  <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger"
               [cdkConnectedOverlayPositions]="positions"
               [cdkConnectedOverlayOpen]="isOpen"
               (detach)="hideActions()"
               (overlayOutsideClick)="outsideClick($event)">
    <ul class="panel">
      @for (action of getActionsList(); track action) {
      <li [ngClass]="{ separator: action === '|' }">
        @if (action !== '|') {
        <div class="action-item"
             [class.inactive]="evaluateFunction(action.inactive)"
             (keypress)="raiseOnAction(action)"
             (click)="raiseOnAction(action)">
          @if (action.imageUrl) {
            <img class="action-image" [src]="action.imageUrl" [alt]="action.title" />
          } @else {
            <app-icon>{{ action.icon }}</app-icon>
          }
          <span class="whitespace-nowrap">{{ action.title }}</span>
        </div>
        }
        </li>
      }
    </ul>
  </ng-template>
</div>
