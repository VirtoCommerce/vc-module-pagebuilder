<div class="wrapper" [class.visible]="isOpen() || visible() || customTrigger()">

  <button type="button" cdkOverlayOrigin #trigger="cdkOverlayOrigin"
    [attr.aria-label]="customTrigger() ? null : accessibleLabel()"
    [attr.aria-expanded]="isOpen()" aria-haspopup="menu" (click)="gearClick($event)">
    @if (customTrigger()) {
    <ng-content />
    } @else {
    <app-icon aria-hidden="true" class="icon" [class.opened]="isOpen()">tune</app-icon>
    }
  </button>
  <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger"
               [cdkConnectedOverlayPositions]="positions"
               [cdkConnectedOverlayOpen]="isOpen()"
               (attach)="focusFirstAction()"
               (detach)="hideActions()"
               (overlayKeydown)="onOverlayKeydown($event)"
               (overlayOutsideClick)="outsideClick($event)">
    <ul #menuPanel class="panel" role="menu" [attr.aria-label]="accessibleLabel()">
      @for (action of getActionsList(); track action) {
      <li role="none" [ngClass]="{ separator: action === '|' }">
        @if (action !== '|') {
        <button type="button" role="menuitem" class="action-item" tabindex="-1"
             [attr.aria-disabled]="evaluateFunction(action.inactive)"
             [class.inactive]="evaluateFunction(action.inactive)"
             (click)="raiseOnAction(action)">
          @if (action.imageUrl) {
            <img class="action-image" [src]="action.imageUrl" [alt]="action.title" />
          } @else {
            <app-icon aria-hidden="true">{{ action.icon }}</app-icon>
          }
          <span>{{ action.title }}</span>
        </button>
        }
        </li>
      }
    </ul>
  </ng-template>
</div>
