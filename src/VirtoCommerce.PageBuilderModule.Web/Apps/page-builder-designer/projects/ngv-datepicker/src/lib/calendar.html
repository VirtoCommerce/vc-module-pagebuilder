<ng-template [cdkPortalOutlet]="_calendarHeaderPortal"></ng-template>

<div class="mat-calendar-content" cdkMonitorSubtreeFocus tabindex="-1">
  @switch (currentView) {
    @case ('month') {
      <mat-month-view
          [(activeDate)]="activeDate"
          [selected]="selected"
          [dateFilter]="dateFilter"
          [maxDate]="maxDate"
          [minDate]="minDate"
          [dateClass]="dateClass()"
          [comparisonStart]="comparisonStart()"
          [comparisonEnd]="comparisonEnd()"
          (_userSelection)="_daySelected($event)">
      </mat-month-view>
    }
    @case ('year') {
      <mat-year-view
          [(activeDate)]="activeDate"
          [selected]="selected"
          [dateFilter]="dateFilter"
          [maxDate]="maxDate"
          [minDate]="minDate"
          [dateClass]="dateClass()"
          (monthSelected)="_monthSelectedInYearView($event)"
          (selectedChange)="hasOutput('month') ? _dateEmit($event) : _goToDateInView($event, 'month')">
      </mat-year-view>
    }
    @case ('multi-year') {
      <mat-multi-year-view
          [yearsPerPage]="yearsPerPage()"
          [yearsPerRow]="yearsPerRow()"
          [(activeDate)]="activeDate"
          [selected]="selected"
          [dateFilter]="dateFilter"
          [maxDate]="maxDate"
          [minDate]="minDate"
          [dateClass]="dateClass()"
          (yearSelected)="_yearSelectedInMultiYearView($event)"
          (selectedChange)="hasOutput('year') ? _dateEmit($event) : _goToDateInView($event, 'year')">
      </mat-multi-year-view>
    }
    @default {
      <mat-clock-view
          [(activeDate)]="activeDate"
          [selected]="$any(selected)"
          [(currentView)]="currentView"
          [dateFilter]="dateFilter"
          [dateClass]="dateClass()"
          [clockStep]="clockStep()"
          [twelveHour]="twelveHour()"
          (selectedChange)="setDate($event)"
          (hourSelected)="_hourSelectedInClockView($any($event))"
          (_userSelection)="_timeSelectedInClockView($event)">
      </mat-clock-view>
    }
  }
</div>
