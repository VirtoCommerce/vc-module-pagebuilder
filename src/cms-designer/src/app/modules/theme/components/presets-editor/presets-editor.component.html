<div class="left-panel-content">
    <div class="preset-list">
        <div *ngFor="let item of data.presets|keyvalue"
            class="preset-list__item" [class.preset-list__item--active]="item.key == current"
            [ngStyle]="{ 'background-image': getThemeThumb(item.key), border: '1px solid black', display: 'flex'}" (click)="selectPreset(item.key)">
            <div style="font-size: 3rem; vertical-align: middle;">{{ item.key }}</div>
        </div>
    </div>
    <p>Changing your theme's style will affect both the settings and look and feel of your store.</p>
    <p>Some settings will be lost when you change your style, but you will not lose any content from your store.</p>
    <!-- <button class="btn btn--green btn--block">
        <span class="btn__text">Save current as new presset</span>
    </button> -->
</div>
<div class="left-panel-footer">
    <button class="btn btn--blue btn--block">
        <span class="btn__text" (click)="applyPreset()">Apply preset</span>
    </button>
    <button class="btn btn--outline btn--block">
        <span class="btn__text">Cancel</span>
    </button>
</div>
