<h2 mat-dialog-title>Paste data into field below</h2>
<mat-dialog-content>
    <form [formGroup]="form">
        <div class="form-input">
            <textarea class="form-control" rows="4" style="height: 200px; width: 630px;" formControlName="data"></textarea>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button class="btn" (click)="onCancelClick()">Cancel</button>
    <button class="btn btn--blue" (click)="onClose()">Ok</button>
</mat-dialog-actions>
